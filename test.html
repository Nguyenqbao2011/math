<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Maths - Bộ Test & Kiểm Thử Dữ Liệu</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      line-height: 1.6;
    }
    h1, h2 { color: #38bdf8; }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .raw-data {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      color: #94a3b8;
      font-size: 0.9rem;
      max-height: 120px;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .metric {
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .metric-label { font-size: 0.8rem; color: #94a3b8; font-weight: bold; }
    .metric-val { font-size: 1.3rem; color: #38bdf8; font-weight: bold; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .test-log { font-family: monospace; font-size: 0.85rem; margin-top: 4px; }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>Kiểm Thử Tập Số Liệu Mới (Maths)</h1>

  <div class="card">
    <h2>1. Tập Dữ Liệu Đầu Vào (<span id="countDisplay">100</span> số)</h2>
    <div class="raw-data" id="rawInputDisplay"></div>
    <button class="btn" id="btnCopyRaw">📋 Sao chép 100 số liệu này</button>
  </div>

  <div class="card">
    <h2>2. Kết Quả Thống Kê Tính Toán Tự Động</h2>
    <div class="grid" id="statsGrid">
      Đang tính toán...
    </div>
  </div>

  <div class="card">
    <h2>3. Kiểm Thử Hệ Thống (Unit Tests)</h2>
    <div id="testResults">Đang chạy kiểm thử...</div>
  </div>

  <script src="stats.js"></script>
  <script>
    const TEST_RAW_STRING = "4.6, 1.2, 4.5, 0.8, 2.5, 3.5, 4.0, 2.0, 10.5, 6.2, -2.5, 1.8, 1.5, 4.0, 7.8, 25.4, 4.0, 5.0, -2.0, 18.5, 11.5, 3.0, 2.2, 7.5, -1.2, 4.5, 7.5, 2.0, 7.0, 7.2, 3.2, -15.5, 8.8, 3.8, -0.5, 2.4, 6.0, 3.6, 0.5, 3.4, 10.0, 3.5, 9.5, -1.8, 5.8, -8.2, 12.0, 8.2, 5.0, -2.5, 8.0, 11.0, 1.0, 9.0, 3.5, 6.5, 2.5, 6.8, 1.5, 13.0, 6.0, 0.2, 4.0, 4.5, 4.8, -0.8, 5.0, 2.5, 6.4, 0.5, 3.5, 8.0, 5.5, 2.8, 2.5, 4.5, 6.5, 9.2, 22.0, 4.4, 4.0, -1.5, 9.8, -0.5, 8.5, 3.5, 1.5, 1.0, 3.0, 5.2, 4.0, 0.0, 4.2, 0.0, 0.0, 5.5, 3.0, 5.4, 7.0, -1.0";

    document.getElementById('rawInputDisplay').textContent = TEST_RAW_STRING;
    document.getElementById('btnCopyRaw').addEventListener('click', () => {
      navigator.clipboard.writeText(TEST_RAW_STRING);
      alert('Đã sao chép 100 số vào Clipboard! Bạn có thể dán vào Maths.');
    });

    const parsedNumbers = StatsEngine.parseNumberList(TEST_RAW_STRING);
    document.getElementById('countDisplay').textContent = parsedNumbers.length;

    const stats = StatsEngine.calculateStats(parsedNumbers);

    function formatNumber(num, maxDecimals = 4) {
      if (typeof num !== 'number' || isNaN(num)) return '-';
      if (Number.isInteger(num)) return num.toString();
      const factor = Math.pow(10, maxDecimals);
      return (Math.round((num + Number.EPSILON) * factor) / factor).toString();
    }

    const outlierStr = stats.outliers.length > 0
      ? [...new Set(stats.outliers)].map(x => formatNumber(x)).join(', ')
      : 'Không có';

    const modeStr = stats.mode.length > 0
      ? stats.mode.map(x => formatNumber(x)).join(', ')
      : 'Không có mốt';

    const metrics = [
      { label: 'Số lượng (N)', val: stats.count },
      { label: 'Trung bình (x̄)', val: formatNumber(stats.mean) },
      { label: 'Trung vị (Me)', val: formatNumber(stats.median) },
      { label: 'Mốt (Mo)', val: modeStr },
      { label: 'Tổng cộng (Σ)', val: formatNumber(stats.sum) },
      { label: 'Giá trị nhỏ nhất (x_min)', val: formatNumber(stats.min) },
      { label: 'Tứ phân vị 1 (Q₁)', val: formatNumber(stats.q1) },
      { label: 'Tứ phân vị 3 (Q₃)', val: formatNumber(stats.q3) },
      { label: 'Khoảng tứ phân vị (IQR)', val: formatNumber(stats.iqr) },
      { label: 'Giá trị bất thường', val: outlierStr },
      { label: 'Khoảng chuẩn', val: `[${formatNumber(stats.lowerOutlierThreshold)} ; ${formatNumber(stats.upperOutlierThreshold)}]` },
      { label: 'Giá trị lớn nhất (x_max)', val: formatNumber(stats.max) },
      { label: 'Khoảng biến thiên (R)', val: formatNumber(stats.range) },
      { label: 'Độ lệch chuẩn (σ)', val: formatNumber(stats.popStdDev) },
      { label: 'Phương sai (σ²)', val: formatNumber(stats.popVariance) }
    ];

    const statsGrid = document.getElementById('statsGrid');
    statsGrid.innerHTML = metrics.map(m => `
      <div class="metric">
        <div class="metric-label">${m.label}</div>
        <div class="metric-val">${m.val}</div>
      </div>
    `).join('');

    // --- UNIT TESTS ---
    const logs = [];
    let passed = 0;
    let failed = 0;

    function assert(desc, condition) {
      if (condition) {
        passed++;
        logs.push(`<div class="test-log pass">✔ PASS: ${desc}</div>`);
      } else {
        failed++;
        logs.push(`<div class="test-log fail">✘ FAIL: ${desc}</div>`);
      }
    }

    assert("Đúng chính xác 100 số phần tử", stats.count === 100);
    assert("Phát hiện đúng giá trị nhỏ nhất min = -15.5", stats.min === -15.5);
    assert("Phát hiện đúng giá trị lớn nhất max = 25.4", stats.max === 25.4);
    assert("Dãy đã sắp xếp có phần tử đầu và cuối chính xác", stats.sorted[0] === -15.5 && stats.sorted[99] === 25.4);
    assert("Tính trung vị hợp lệ", typeof stats.median === 'number' && !isNaN(stats.median));
    assert("Tính trung bình hợp lệ", typeof stats.mean === 'number' && !isNaN(stats.mean));
    assert("Phát hiện đúng các giá trị bất thường (outliers)", stats.outliers.length > 0);

    document.getElementById('testResults').innerHTML = `
      <div><strong>Kết quả: ${passed} kiểm thử vượt qua, ${failed} thất bại.</strong></div>
      ${logs.join('')}
    `;
  </script>
</body>
</html>
