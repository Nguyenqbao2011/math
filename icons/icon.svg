<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.8" />
  
  <!-- Math Sigma / Bell Curve Symbol -->
  <g filter="url(#shadow)">
    <!-- Statistics Normal Distribution Bell Curve -->
    <path d="M 96 360 C 180 360, 200 150, 256 150 C 312 150, 332 360, 416 360" 
          fill="none" stroke="url(#grad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Central Mean Indicator Line -->
    <line x1="256" y1="150" x2="256" y2="360" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8 8" stroke-linecap="round" />
    
    <!-- Sigma Symbol Σ in center-left -->
    <path d="M 170 210 L 230 210 L 195 245 L 230 280 L 170 280" 
          fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Division / Plus badges -->
    <circle cx="340" cy="225" r="7" fill="#f43f5e" />
    <line x1="325" y1="245" x2="355" y2="245" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <circle cx="340" cy="265" r="7" fill="#f43f5e" />
  </g>
</svg>
